<title>Ciclora EHS Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>/* Ciclora EHS — guia de estilo aplicado
   Cores da marca, tipografia Inter, componentes reutilizáveis. */
:root {
  color-scheme: light;
  --deep: #0E4D3A;        /* verde-floresta: marca, navegação */
  --deep-2: #0A3B2C;
  --teal: #1A8F7A;        /* ação primária */
  --teal-soft: #E3F3EE;
  --mint: #34B98A;
  --lime: #A6D86B;
  --bg: #F3F6F2;          /* fundo da aplicação */
  --surface: #FFFFFF;
  --line: #E1E7E1;
  --line-2: #CBD5CC;
  --ink: #15261F;
  --ink-2: #4B5D54;
  --ink-3: #7A8A82;
  --s-i: #C9792B;         /* Classe I / custo */
  --s-iia: #1A8F7A;       /* Classe II A / receita */
  --s-iib: #3D6FB6;       /* Classe II B */
  --ok: #1E7F4F;  --ok-bg: #E2F4EA;
  --warn: #9A6200; --warn-bg: #FFF2D6;
  --bad: #B3261E; --bad-bg: #FCE5E3;
  --info: #2D5E9E; --info-bg: #E4EDF9;
  --radius: 14px;
  --shadow: 0 1px 2px rgba(14, 77, 58, .06), 0 4px 16px rgba(14, 77, 58, .05);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--teal); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; background: linear-gradient(to right, var(--deep) 248px, var(--bg) 248px); }
.sidebar {
  background: var(--deep); color: #DDEDE6; padding: 22px 14px; display: flex; flex-direction: column; gap: 6px;
  position: sticky; top: 0; height: 100vh;
}
.sidebar .brand { padding: 4px 10px 18px; }
.sidebar .brand svg { width: 100%; height: auto; display: block; }
.nav-label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #8FB5A6; padding: 14px 12px 6px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: #DDEDE6;
  text-decoration: none; font-weight: 500;
}
.nav a svg { width: 18px; height: 18px; flex: none; opacity: .9; }
.nav a:hover { background: rgba(255,255,255,.07); }
.nav a.active { background: rgba(166, 216, 107, .16); color: #fff; box-shadow: inset 3px 0 0 var(--lime); }
.sidebar .client-card {
  margin-top: auto; background: rgba(255,255,255,.06); border-radius: 12px; padding: 12px; font-size: 12px; color: #BFD8CD;
}
.client-card strong { display: block; color: #fff; font-size: 13px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 32px;
  background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
}
.topbar h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.topbar .sub { color: var(--ink-3); font-size: 13px; }
.view-switch { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.view-switch button {
  border: 0; background: transparent; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; color: var(--ink-2);
}
.view-switch button.on { background: var(--deep); color: #fff; }
.content { padding: 26px 32px 60px; display: flex; flex-direction: column; gap: 20px; }
.menu-btn { display: none; }

/* ---------- cards & grid ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-pad { padding: 18px 20px; }
.card h2 { font-size: 15px; margin: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 0; flex-wrap: wrap; }
.card-head p { margin: 2px 0 0; color: var(--ink-3); font-size: 12.5px; }
.grid { display: grid; gap: 16px; }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-2-1 { grid-template-columns: 2fr 1fr; }
.span-2 { grid-column: span 2; }

.kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
.kpi .value { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .value small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
.kpi .foot { font-size: 12px; color: var(--ink-3); }
.delta-up { color: var(--ok); font-weight: 600; }
.delta-down { color: var(--bad); font-weight: 600; }
.kpi.accent { background: var(--deep); color: #fff; border-color: var(--deep); }
.kpi.accent .label, .kpi.accent .foot { color: #BFD8CD; }
.kpi.accent .value small { color: #BFD8CD; }

/* ---------- toolbar / filters ---------- */
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 12px; cursor: pointer; color: var(--ink-2); font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line-2); }
.seg button.on { background: var(--teal-soft); color: var(--deep); }

.btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface);
  padding: 8px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap;
}
.btn:hover { border-color: var(--teal); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: #157966; }
.btn.dark { background: var(--deep); border-color: var(--deep); color: #fff; }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 12.5px; border-radius: 8px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

/* ---------- forms ---------- */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form .full { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field label .req { color: var(--bad); }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 11px; background: #fff; outline: none;
}
.input:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26, 143, 122, .15); }
.hint { font-size: 12px; color: var(--ink-3); }

/* ---------- tables ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
.t th {
  text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em;
  padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: #FAFCFA;
}
.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tbody tr:hover td { background: #F8FBF9; }
.t .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t .muted { color: var(--ink-3); }
.t .strong { font-weight: 600; }
.t tfoot td { font-weight: 700; background: #FAFCFA; }
.t input.input { padding: 6px 9px; }

/* ---------- badges ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.b-ok { background: var(--ok-bg); color: var(--ok); }
.b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); }
.b-info { background: var(--info-bg); color: var(--info); }
.b-neutral { background: #EDF1EE; color: var(--ink-2); }
.classe { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.classe i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---------- charts ---------- */
.chart { padding: 8px 16px 16px; position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .axis text { fill: var(--ink-3); font-size: 11px; }
.chart .grid-line { stroke: #E9EEE9; }
.chart .baseline { stroke: var(--line-2); }
.chart .lbl { fill: var(--ink-2); font-size: 11.5px; }
.chart .val { fill: var(--ink); font-size: 11.5px; font-weight: 600; }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover + .hover-band, .chart g.col:hover .band { opacity: 1; }
.chart .band { fill: rgba(14, 77, 58, .05); opacity: 0; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; padding: 10px 20px 0; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.tooltip {
  position: fixed; pointer-events: none; background: var(--deep-2); color: #fff; padding: 8px 11px; border-radius: 9px;
  font-size: 12.5px; z-index: 100; box-shadow: 0 6px 18px rgba(0,0,0,.18); opacity: 0; transition: opacity .1s; max-width: 260px;
}
.tooltip b { display: block; margin-bottom: 3px; }
.tooltip .row { display: flex; gap: 10px; justify-content: space-between; }
.tooltip .row i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 5px; }

/* ---------- alerts ---------- */
.alerts { list-style: none; margin: 0; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.alerts li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: #FAFCFA; border: 1px solid var(--line); }
.alerts li .ic { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.alerts li .ic svg { width: 15px; height: 15px; }
.alerts li strong { display: block; font-size: 13px; }
.alerts li span { font-size: 12px; color: var(--ink-3); }

.banner { display: flex; gap: 12px; align-items: center; padding: 14px 18px; border-radius: 12px; border: 1px solid; }
.banner svg { width: 20px; height: 20px; flex: none; }
.banner.info { background: var(--info-bg); border-color: #C5D6EE; color: #1F3F6B; }
.banner.warn { background: var(--warn-bg); border-color: #F1D9A3; color: #6B4600; }
.banner.ok { background: var(--ok-bg); border-color: #BFE3CE; color: #155A38; }
.banner.bad { background: var(--bad-bg); border-color: #F2C3BF; color: #7D1A14; }

/* ---------- steps (portal parceiro) ---------- */
.steps { display: flex; gap: 8px; }
.step { flex: 1; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.step .n { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: #EDF1EE; color: var(--ink-2); flex: none; }
.step.done .n { background: var(--teal); color: #fff; }
.step.current { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(26,143,122,.12); }
.step small { display: block; color: var(--ink-3); font-size: 12px; }

.dropzone {
  border: 2px dashed var(--line-2); border-radius: 12px; padding: 18px; text-align: center; color: var(--ink-2); cursor: pointer; background: #FAFCFA;
}
.dropzone:hover, .dropzone.drag { border-color: var(--teal); background: var(--teal-soft); }
.dropzone strong { color: var(--teal); }

/* ---------- modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 40, 30, .45); display: grid; place-items: center; z-index: 50; padding: 20px; }
.modal { background: #fff; border-radius: 16px; width: min(760px, 100%); max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.25); }
.modal.wide { width: min(980px, 100%); }
.modal header { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); }
.modal header h3 { margin: 0; font-size: 17px; }
.modal .body { padding: 20px 22px; overflow: auto; }
.modal footer { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 22px; border-top: 1px solid var(--line); background: #FAFCFA; border-radius: 0 0 16px 16px; }
.x { border: 0; background: transparent; font-size: 22px; cursor: pointer; color: var(--ink-3); line-height: 1; }
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--deep); color: #fff; padding: 11px 18px;
  border-radius: 10px; z-index: 200; font-weight: 500; box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
.toast.err { background: var(--bad); }

.kv { display: grid; grid-template-columns: 160px 1fr; gap: 6px 14px; font-size: 13px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; font-weight: 500; }

/* ---------- documento MTR ---------- */
.mtr-doc { border: 1.5px solid var(--ink); border-radius: 6px; padding: 22px; font-size: 12.5px; background: #fff; }
.mtr-doc .hd { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 1.5px solid var(--ink); padding-bottom: 12px; margin-bottom: 14px; gap: 12px; }
.mtr-doc h4 { margin: 0; font-size: 16px; text-transform: uppercase; letter-spacing: .03em; }
.mtr-doc .num { font-size: 18px; font-weight: 800; text-align: right; }
.mtr-doc section { border: 1px solid #9AA59F; border-radius: 4px; margin-bottom: 10px; }
.mtr-doc section h5 { margin: 0; background: #EEF2EF; padding: 5px 10px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid #9AA59F; }
.mtr-doc section .in { padding: 8px 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 14px; }
.mtr-doc section .in div span { display: block; font-size: 10.5px; color: #59665F; text-transform: uppercase; }
.mtr-doc table { width: 100%; border-collapse: collapse; }
.mtr-doc table th, .mtr-doc table td { border-top: 1px solid #C9D1CC; padding: 6px 10px; text-align: left; font-size: 12px; }
.mtr-doc .sign { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 28px; }
.mtr-doc .sign div { border-top: 1px solid var(--ink); padding-top: 6px; text-align: center; font-size: 11px; }

.empty { padding: 30px; text-align: center; color: var(--ink-3); }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 10px 14px; cursor: pointer; font-weight: 600; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--deep); border-bottom-color: var(--teal); }

@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-2-1, .g-3 { grid-template-columns: 1fr; }
}
@media (max-width: 780px) {
  .app { grid-template-columns: 1fr; background: var(--bg); }
  .sidebar { position: fixed; z-index: 40; left: -260px; width: 248px; transition: left .2s; }
  .sidebar.open { left: 0; }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 14px 16px; flex-wrap: wrap; }
  .content { padding: 18px 16px 50px; }
  .g-2, .g-4 { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .form { grid-template-columns: 1fr; }
  .steps { flex-direction: column; }
  .kv { grid-template-columns: 1fr; }
  .mtr-doc section .in { grid-template-columns: 1fr 1fr; }
}

@media print {
  body * { visibility: hidden; }
  .mtr-doc, .mtr-doc * { visibility: visible; }
  .mtr-doc { position: absolute; left: 0; top: 0; width: 100%; border: 0; }
  .modal-bg { background: none; }
}
.dropzone svg { width: 26px; height: 26px; color: var(--teal); }
.nowrap { white-space: nowrap; }
</style>

function badge(status) {

function validadeBadge(v) {

  if (d < 0) return `<span class="badge b-bad">Vencido há ${-d} d</span>`;
  if (d <= 30) return `<span class="badge b-warn">Vence em ${d} d</span>`;
  return `<span class="badge b-ok">Válido até ${fmtD(v)}</span>`;
}
const classeTag = c => `<span class="classe"><i style="background:${CLASSE_COR[c] || '#999'}"></i>${esc(c)}</span>`;

function toast(msg, err) {

function modal({ title, body, actions = '', wide = false, onMount }) {

    <div class="body">${body}</div>${actions ? `<footer>${actions}</footer>` : ''}</div>`;
  const close = () => bg.remove();
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('.x') || e.target.closest('[data-close]')) close(); });
  document.body.appendChild(bg);
  if (onMount) onMount(bg, close);
  return { el: bg, close };
}

function formData(form) {

/* ---------------- gráficos SVG (sem dependências externas) ---------------- */
const Tip = (() => {
  let el;
  const ensure = () => { if (!el) { el = document.createElement('div'); el.className = 'tooltip'; document.body.appendChild(el); } return el; };
  return {
    show(html, e) { const t = ensure(); t.innerHTML = html; t.style.opacity = 1; Tip.move(e); },
    move(e) { const t = ensure(); const w = t.offsetWidth; let x = e.clientX + 14; if (x + w > innerWidth - 8) x = e.clientX - w - 14; t.style.left = x + 'px'; t.style.top = (e.clientY + 14) + 'px'; },
    hide() { if (el) el.style.opacity = 0; },
  };
})();
function bindTips(root) {
  $$('[data-tip]', root).forEach(n => {
    n.addEventListener('mouseenter', e => Tip.show(decodeURIComponent(n.dataset.tip), e));
    n.addEventListener('mousemove', e => Tip.move(e));
    n.addEventListener('mouseleave', Tip.hide);
  });
}
function niceMax(v) {
  if (v <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v / p;
  return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p;
}
function roundedTopRect(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

/** Colunas (empilhadas ou agrupadas).
 *  cats: rótulos do eixo x; series: [{name,color,values}] ; mode: 'stack' | 'group' */
function columnChart({ cats, series, mode = 'stack', height = 260, width = 720, fmt = fmtN, fmtAxis = fmt, unit = '' }) {
  const W = width, H = height, L = 52, R = 8, T = 12, B = 28;
  const iw = W - L - R, ih = H - T - B;
  const totals = cats.map((_, i) => mode === 'stack' ? series.reduce((s, se) => s + (se.values[i] || 0), 0) : Math.max(...series.map(se => se.values[i] || 0)));
  const max = niceMax(Math.max(...totals) * 1.05);
  const y = v => T + ih - (v / max) * ih;
  const step = iw / cats.length;
  const gap = 2;
  const bw = mode === 'stack' ? Math.min(34, step * .62) : Math.min(22, step * .34);
  let g = '';
  for (let k = 0; k <= 4; k++) {
    const v = max * k / 4;
    g += `<line class="grid-line" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtAxis(v)}</text>`;
  }
  const every = Math.ceil(cats.length / 12);
  let cols = '';
  cats.forEach((c, i) => {
    const cx = L + step * i + step / 2;
    let marks = '';
    if (mode === 'stack') {
      let acc = 0;
      const vis = series.filter(se => (se.values[i] || 0) > 0);
      vis.forEach((se, j) => {
        const v = se.values[i] || 0;
        const y0 = y(acc), y1 = y(acc + v);
        const top = j === vis.length - 1;
        const h = Math.max(0, y0 - y1 - (top ? 0 : gap));
        marks += top ? `<path d="${roundedTopRect(cx - bw / 2, y1, bw, y0 - y1, 4)}" fill="${se.color}"/>`
          : `<rect x="${cx - bw / 2}" y="${y1 + gap}" width="${bw}" height="${h}" fill="${se.color}"/>`;
        acc += v;
      });
    } else {
      const n = series.length;
      series.forEach((se, j) => {
        const v = se.values[i] || 0;
        const x = cx - (n * bw + (n - 1) * gap) / 2 + j * (bw + gap);
        marks += `<path d="${roundedTopRect(x, y(v), bw, T + ih - y(v), 4)}" fill="${se.color}"/>`;
      });
    }
    const tip = `<b>${esc(c)}</b>` + series.map(se => `<div class="row"><span><i style="background:${se.color}"></i>${esc(se.name)}</span><span>${fmt(se.values[i] || 0)}${unit}</span></div>`).join('') +
      (mode === 'stack' && series.length > 1 ? `<div class="row" style="border-top:1px solid rgba(255,255,255,.2);margin-top:4px;padding-top:4px"><span>Total</span><span>${fmt(totals[i])}${unit}</span></div>` : '');
    cols += `<g class="col"><rect class="band" x="${L + step * i}" y="${T}" width="${step}" height="${ih}"/>${marks}
      ${i % every === 0 ? `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(c)}</text>` : ''}
      <rect class="hit" x="${L + step * i}" y="${T}" width="${step}" height="${ih}" data-tip="${encodeURIComponent(tip)}"/></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><g class="axis">${g}${cols}</g><line class="baseline" x1="${L}" x2="${W - R}" y1="${T + ih}" y2="${T + ih}"/></svg>`;
}

/** Barras horizontais de uma série. items: [{label, value, sub}] */
function barList({ items, color = 'var(--teal)', fmt = fmtN, unit = '', width = 340 }) {
  const W = width, rowH = 34, L = 0, labelW = 0;
  const max = Math.max(...items.map(i => i.value), 1);
  const H = items.length * rowH + 4;
  let out = '';
  items.forEach((it, k) => {
    const y = k * rowH;
    const w = Math.max(2, (it.value / max) * (W - 130));
    const tip = `<b>${esc(it.label)}</b><div class="row"><span>${fmt(it.value)}${unit}</span><span>${it.sub || ''}</span></div>`;
    out += `<g><text class="lbl" x="${L}" y="${y + 11}">${esc(it.label)}</text>
      <path d="M${labelW},${y + 16}H${labelW + w - 4}Q${labelW + w},${y + 16} ${labelW + w},${y + 20}V${y + 24}Q${labelW + w},${y + 28} ${labelW + w - 4},${y + 28}H${labelW}Z" fill="${it.color || color}"/>
      <text class="val" x="${labelW + w + 8}" y="${y + 26}">${fmt(it.value)}${unit}${it.sub ? ` <tspan fill="var(--ink-3)" font-weight="400">· ${esc(it.sub)}</tspan>` : ''}</text>
      <rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-tip="${encodeURIComponent(tip)}"/></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${out}</svg>`;
}

function legend(series) {
  return `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
</script><script>/* Camada de acesso a dados.
   - Modo normal: conversa com a API Flask (/api/...).
   - Modo protótipo (window.CICLORA_SEED definido): usa dados em memória,
     permitindo navegar no protótipo de alta fidelidade sem servidor. */
const Api = (() => {
  const MOCK = !!window.CICLORA_SEED;

  async function http(method, url, body, isForm) {
    const opt = { method, headers: {} };
    if (body && !isForm) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
    if (isForm) opt.body = body;
    const r = await fetch(url, opt);
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.erro || `Erro ${r.status}`);
    return data;
  }

  // ---------- implementação em memória (protótipo) ----------
  const mem = MOCK ? JSON.parse(JSON.stringify(window.CICLORA_SEED.tables)) : null;
  const nextId = t => (mem[t].reduce((m, r) => Math.max(m, r.id), 0) + 1);
  const mock = {
    async list(t) { return mem[t].map(r => ({ ...r })); },
    async create(t, data) {
      const row = { id: nextId(t), ...data };
      if (t === 'parceiros' && !row.status) row.status = 'Rascunho';
      mem[t].push(row); return { ...row };
    },
    async update(t, id, data) {
      const row = mem[t].find(r => r.id === id); Object.assign(row, data); return { ...row };
    },
    async remove(t, id) {
      mem[t] = mem[t].filter(r => r.id !== id);
      if (t === 'mtrs') mem.mtr_itens = mem.mtr_itens.filter(i => i.mtr_id !== id);
      return { ok: true };
    },
    async emitirMtr(data) {
      const itens = (data.itens || []).filter(i => i.residuo_id && +i.quantidade > 0);
      if (!data.transportador_id || !data.destinador_id) throw new Error('Informe transportador e destinador');
      if (!itens.length) throw new Error('Inclua ao menos um resíduo com quantidade');
      const ult = mem.mtrs.reduce((m, r) => Math.max(m, +r.numero.slice(9)), 0);
      const emissao = data.data_emissao || isoDate(TODAY);
      const mtr = { id: nextId('mtrs'), numero: `MTR-${emissao.slice(0, 4)}-${String(ult + 1).padStart(6, '0')}`,
        data_emissao: emissao, transportador_id: +data.transportador_id, destinador_id: +data.destinador_id,
        placa: data.placa, motorista: data.motorista, status: 'Emitido', data_recebimento: null, cdf_numero: null, observacao: data.observacao };
      mem.mtrs.push(mtr);
      itens.forEach(i => mem.mtr_itens.push({ id: nextId('mtr_itens'), mtr_id: mtr.id, residuo_id: +i.residuo_id, quantidade: +i.quantidade, acondicionamento: i.acondicionamento }));
      return { ...mtr };
    },
    async lote(data) {
      data.itens.forEach(i => {
        if (i.quantidade === '' || i.quantidade == null) return;
        const ex = mem.geracoes.find(g => g.residuo_id === +i.residuo_id && g.semana === data.semana);
        if (ex) ex.quantidade = +i.quantidade;
        else mem.geracoes.push({ id: nextId('geracoes'), residuo_id: +i.residuo_id, semana: data.semana, quantidade: +i.quantidade });
      });
      return { ok: true };
    },
    async upload(form) {
      const f = form.get('arquivo');
      const row = { id: nextId('documentos'), parceiro_id: +form.get('parceiro_id'), tipo: form.get('tipo'), numero: form.get('numero'),
        emissao: form.get('emissao'), validade: form.get('validade'), arquivo: null, nome_arquivo: f && f.name ? f.name : null,
        status: 'Pendente', enviado_em: null };
      mem.documentos.push(row); return { ...row };
    },
  };

  const real = {
    list: t => http('GET', `/api/${t}`),
    create: (t, d) => http('POST', `/api/${t}`, d),
    update: (t, id, d) => http('PUT', `/api/${t}/${id}`, d),
    remove: (t, id) => http('DELETE', `/api/${t}/${id}`),
    emitirMtr: d => http('POST', '/api/mtrs', d),
    lote: d => http('POST', '/api/geracoes/lote', d),
    upload: form => http('POST', '/api/documentos/upload', form, true),
  };

  const impl = MOCK ? mock : real;

  // carrega todas as tabelas de uma vez (volume pequeno no MVP)
  async function loadAll() {
    const names = ['parceiros', 'documentos', 'residuos', 'geracoes', 'mtrs', 'mtr_itens', 'financeiro'];
    const res = await Promise.all(names.map(n => impl.list(n)));
    const db = {};
    names.forEach((n, i) => { db[n] = res[i]; });
    db.byId = (t, id) => db[t].find(r => r.id === +id);
    return db;
  }

  return { ...impl, loadAll, MOCK };
})();
</script><script>/* Dashboard: indicadores de gestão de resíduos (calculados a partir das tabelas). */
let dashPeriodo = 12; // semanas

function renderDashboard(view, db) {
  const res = id => db.byId('residuos', id);
  const semanas = [...new Set(db.geracoes.map(g => g.semana))].sort();
  const per = semanas.slice(-dashPeriodo);
  const prev = semanas.slice(-dashPeriodo * 2, -dashPeriodo);
  const inS = (g, list) => list.includes(g.semana);
  const sum = (arr, f) => arr.reduce((s, x) => s + f(x), 0);

  const gPer = db.geracoes.filter(g => inS(g, per));
  const gPrev = db.geracoes.filter(g => inS(g, prev));
  const total = sum(gPer, g => g.quantidade);
  const totalPrev = sum(gPrev, g => g.quantidade);
  const varPct = totalPrev ? (total / totalPrev - 1) * 100 : 0;
  const mediaSem = total / Math.max(per.length, 1);

  const valorizado = sum(gPer.filter(g => VALORIZACAO.includes(res(g.residuo_id)?.destinacao)), g => g.quantidade);
  const taxaVal = total ? valorizado / total * 100 : 0;
  const perigoso = sum(gPer.filter(g => res(g.residuo_id)?.classe === 'Classe I'), g => g.quantidade);

  const ini = per[0] || '0000-00-00';
  const fPer = db.financeiro.filter(f => f.data >= ini);
  const receita = sum(fPer.filter(f => f.tipo === 'Receita'), f => f.valor);
  const custo = sum(fPer.filter(f => f.tipo === 'Custo'), f => f.valor);
  const saldo = receita - custo;

  const pendCdf = db.mtrs.filter(m => m.status === 'Emitido' || m.status === 'Em transporte');
  const mtrPer = db.mtrs.filter(m => m.data_emissao >= ini && m.status !== 'Cancelado');

  const ativos = db.parceiros.filter(p => p.status === 'Homologado' || p.status === 'Em análise').map(p => p.id);
  const docsAtivos = db.documentos.filter(d => ativos.includes(d.parceiro_id) && d.validade);
  const vencidos = docsAtivos.filter(d => daysUntil(d.validade) < 0);
  const vencendo = docsAtivos.filter(d => daysUntil(d.validade) >= 0 && daysUntil(d.validade) <= 30);

  // ----- séries -----
  const classes = ['Classe I', 'Classe II A', 'Classe II B'];
  const seriesClasse = classes.map(c => ({
    name: c, color: CLASSE_COR[c],
    values: per.map(s => sum(db.geracoes.filter(g => g.semana === s && res(g.residuo_id)?.classe === c), g => g.quantidade) / 1000),
  }));
  const porDest = DESTINACOES.map(d => ({ label: d, value: sum(gPer.filter(g => res(g.residuo_id)?.destinacao === d), g => g.quantidade) / 1000 }))
    .filter(x => x.value > 0).sort((a, b) => b.value - a.value)
    .map(x => ({ ...x, sub: `${fmtN(x.value * 1000 / total * 100, 1)}%`, color: VALORIZACAO.includes(x.label) ? 'var(--teal)' : 'var(--s-i)' }));
  const meses = [...new Set(db.financeiro.map(f => f.data.slice(0, 7)))].sort().slice(-6);
  const seriesFin = [
    { name: 'Receita', color: 'var(--s-iia)', values: meses.map(m => sum(db.financeiro.filter(f => f.tipo === 'Receita' && f.data.startsWith(m)), f => f.valor)) },
    { name: 'Custo', color: 'var(--s-i)', values: meses.map(m => sum(db.financeiro.filter(f => f.tipo === 'Custo' && f.data.startsWith(m)), f => f.valor)) },
  ];
  const top = db.residuos.map(r => ({ label: r.nome, value: sum(gPer.filter(g => g.residuo_id === r.id), g => g.quantidade) / 1000, color: CLASSE_COR[r.classe], sub: r.classe }))
    .sort((a, b) => b.value - a.value).slice(0, 6);

  // ----- alertas -----
  const alertas = [];
  vencidos.forEach(d => alertas.push({ t: 'bad', title: `${d.tipo} vencido`, sub: `${db.byId('parceiros', d.parceiro_id)?.razao_social} · venceu em ${fmtD(d.validade)}`, link: '#parceiros' }));
  vencendo.forEach(d => alertas.push({ t: 'warn', title: `${d.tipo} vence em ${daysUntil(d.validade)} dias`, sub: db.byId('parceiros', d.parceiro_id)?.razao_social, link: '#parceiros' }));
  const atrasadas = pendCdf.filter(m => daysUntil(m.data_emissao) < -5);
  if (atrasadas.length) alertas.push({ t: 'warn', title: `${atrasadas.length} MTR(s) sem CDF há mais de 5 dias`, sub: 'Cobrar Certificado de Destinação Final do destinador', link: '#mtr' });
  db.parceiros.filter(p => p.status === 'Em análise').forEach(p => alertas.push({ t: 'info', title: 'Documentação aguardando análise', sub: p.razao_social, link: '#parceiros' }));
  const semAtual = mondayOf(TODAY);
  const ultimaSem = semanas[semanas.length - 1];
  const esperada = isoDate(new Date(parseD(semAtual).getTime() - 7 * 864e5));
  if (ultimaSem < esperada) alertas.push({ t: 'warn', title: 'Geração da semana anterior não lançada', sub: `Semana de ${fmtD(esperada)}`, link: '#residuos-semana' });
  const icon = { bad: ['var(--bad-bg)', 'var(--bad)', ICON.alert], warn: ['var(--warn-bg)', 'var(--warn)', ICON.clock], info: ['var(--info-bg)', 'var(--info)', ICON.info] };

  view.innerHTML = `
    <div class="toolbar">
      <span class="hint">Período de análise</span>
      <div class="seg" id="periodo">${[[4, '4 semanas'], [12, '12 semanas'], [semanas.length, 'Todo o histórico']].map(([v, l]) => `<button data-v="${v}" class="${dashPeriodo === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <span class="spacer"></span>
      <span class="hint">${fmtD(per[0])} a ${fmtD(isoDate(new Date(parseD(per[per.length - 1]).getTime() + 6 * 864e5)))}</span>
    </div>

    <div class="grid g-4">
      <div class="card kpi accent"><div class="label">Resíduos gerados</div>
        <div class="value">${fmtT(total)}<small>t</small></div>
        <div class="foot">Média de ${fmtT(mediaSem)} t/semana${prev.length === per.length ? ` · <span style="color:${varPct > 0 ? '#FFD39A' : 'var(--lime)'}">${varPct > 0 ? '▲' : '▼'} ${fmtN(Math.abs(varPct), 1)}%</span> vs. período anterior` : ''}</div></div>
      <div class="card kpi"><div class="label">Taxa de valorização (desvio de aterro)</div>
        <div class="value">${fmtN(taxaVal, 1)}<small>%</small></div>
        <div class="foot">${fmtT(valorizado)} t recicladas, reutilizadas ou coprocessadas</div></div>
      <div class="card kpi"><div class="label">Saldo financeiro dos resíduos</div>
        <div class="value" style="color:${saldo >= 0 ? 'var(--ok)' : 'var(--bad)'}">${fmtBRLk(saldo)}</div>
        <div class="foot">Receita ${fmtBRLk(receita)} · Custo ${fmtBRLk(custo)}</div></div>
      <div class="card kpi"><div class="label">Resíduos perigosos (Classe I)</div>
        <div class="value">${fmtN(total ? perigoso / total * 100 : 0, 1)}<small>%</small></div>
        <div class="foot">${fmtT(perigoso)} t no período</div></div>
    </div>
    <div class="grid g-4">
      <div class="card kpi"><div class="label">Custo de gestão por tonelada</div><div class="value">${fmtBRL(total ? custo / (total / 1000) : 0)}</div><div class="foot">Custos totais ÷ toneladas geradas</div></div>
      <div class="card kpi"><div class="label">MTRs emitidas no período</div><div class="value">${mtrPer.length}</div><div class="foot">${pendCdf.length} aguardando CDF do destinador</div></div>
      <div class="card kpi"><div class="label">Documentos de parceiros</div><div class="value" style="color:${vencidos.length ? 'var(--bad)' : 'inherit'}">${vencidos.length}<small>vencido(s)</small></div><div class="foot">${vencendo.length} vencendo nos próximos 30 dias</div></div>
      <div class="card kpi"><div class="label">Parceiros homologados</div><div class="value">${db.parceiros.filter(p => p.status === 'Homologado').length}<small>de ${db.parceiros.length}</small></div><div class="foot">${db.parceiros.filter(p => p.status === 'Em análise').length} em análise</div></div>
    </div>

    <div class="grid g-2-1">
      <div class="card">
        <div class="card-head"><div><h2>Geração semanal por classe (t)</h2><p>Classificação ABNT NBR 10004 · passe o mouse para ver os valores</p></div></div>
        ${legend(seriesClasse)}
        <div class="chart">${columnChart({ cats: per.map(fmtDs), series: seriesClasse, height: 330, fmt: v => fmtN(v, 1), fmtAxis: v => fmtN(v, 0), unit: ' t' })}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>Alertas de conformidade</h2><p>${alertas.length} item(ns) exigem atenção</p></div></div>
        <ul class="alerts">${alertas.slice(0, 7).map(a => `<li><div class="ic" style="background:${icon[a.t][0]};color:${icon[a.t][1]}">${icon[a.t][2]}</div><div style="flex:1"><strong>${esc(a.title)}</strong><span>${esc(a.sub || '')}</span></div><a class="btn sm" href="${a.link}">Ver</a></li>`).join('') || '<li><div>Nenhuma pendência. 🎉</div></li>'}</ul>
      </div>
    </div>

    <div class="grid g-3">
      <div class="card">
        <div class="card-head"><div><h2>Destinação final (t)</h2><p><span style="color:var(--teal);font-weight:600">■</span> valorização · <span style="color:var(--s-i);font-weight:600">■</span> disposição</p></div></div>
        <div class="chart" style="padding-top:14px">${barList({ items: porDest, fmt: v => fmtN(v, 1), unit: ' t' })}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>Maiores geradores (t)</h2><p>Resíduos com maior volume no período</p></div></div>
        <div class="chart" style="padding-top:14px">${barList({ items: top, fmt: v => fmtN(v, 1), unit: ' t' })}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>Receita × custo mensal</h2><p>Últimos ${meses.length} meses</p></div></div>
        ${legend(seriesFin)}
        <div class="chart">${columnChart({ cats: meses.map(fmtMes), series: seriesFin, mode: 'group', height: 260, width: 380, fmt: fmtBRL, fmtAxis: v => fmtBRLk(v).replace('R$ ', '') })}</div>
