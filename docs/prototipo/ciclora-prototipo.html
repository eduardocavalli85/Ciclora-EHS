  $$('#periodo button', view).forEach(b => b.onclick = () => { dashPeriodo = +b.dataset.v; renderDashboard(view, db); bindTips(view); });
}
</script><script>/* Gestão de parceiros (visão do cliente): homologação e controle de documentos. */
const TIPOS_PARCEIRO = ['Transportador', 'Destinador', 'Transportador e Destinador'];
const DOCS_EXIGIDOS = {
  Destinador: ['Licença de Operação (LO)', 'CTF/APP IBAMA', 'Alvará de Funcionamento'],
  Transportador: ['Licença Ambiental de Transporte', 'CTF/APP IBAMA', 'Registro ANTT', 'Apólice de seguro RCTR-C'],
};
const docsExigidos = tipo => [...new Set([...(tipo.includes('Destinador') ? DOCS_EXIGIDOS.Destinador : []), ...(tipo.includes('Transportador') ? DOCS_EXIGIDOS.Transportador : [])])];
let parcFiltro = 'Todos';

function docResumo(db, p) {
  const docs = db.documentos.filter(d => d.parceiro_id === p.id);
  const venc = docs.filter(d => d.validade && daysUntil(d.validade) < 0).length;
  const prox = docs.filter(d => d.validade && daysUntil(d.validade) >= 0 && daysUntil(d.validade) <= 30).length;
  const aprov = docs.filter(d => d.status === 'Aprovado').length;
  return { docs, venc, prox, aprov, exig: docsExigidos(p.tipo).length };
}

function renderParceiros(view, db) {
  const lista = db.parceiros.filter(p => parcFiltro === 'Todos' || p.status === parcFiltro);
  const cont = s => db.parceiros.filter(p => p.status === s).length;
  view.innerHTML = `
    <div class="grid g-4">
      <div class="card kpi"><div class="label">Homologados</div><div class="value">${cont('Homologado')}</div><div class="foot">Aptos a receber MTR</div></div>
      <div class="card kpi"><div class="label">Em análise</div><div class="value">${cont('Em análise')}</div><div class="foot">Documentação enviada pelo parceiro</div></div>
      <div class="card kpi"><div class="label">Em preenchimento</div><div class="value">${cont('Rascunho')}</div><div class="foot">Cadastro iniciado no portal</div></div>
      <div class="card kpi"><div class="label">Documentos com alerta</div><div class="value">${db.parceiros.reduce((s, p) => { const r = docResumo(db, p); return s + r.venc + r.prox; }, 0)}</div><div class="foot">Vencidos ou vencendo em 30 dias</div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="seg" id="filtro">${['Todos', 'Homologado', 'Em análise', 'Rascunho', 'Reprovado'].map(s => `<button class="${parcFiltro === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('')}</div>
        <div class="toolbar"><a class="btn" href="#portal">${ICON.user} Abrir Portal do Parceiro</a><button class="btn primary" id="novo">${ICON.plus} Novo parceiro</button></div>
      </div>
      <div class="table-wrap" style="margin-top:14px"><table class="t">
        <thead><tr><th>Razão social</th><th>CNPJ</th><th>Tipo</th><th>Atividade</th><th>Documentos</th><th>Status</th><th></th></tr></thead>
        <tbody>${lista.map(p => {
          const r = docResumo(db, p);
          const alert = r.venc ? `<span class="badge b-bad">${r.venc} vencido(s)</span>` : r.prox ? `<span class="badge b-warn">${r.prox} a vencer</span>` : '';
          return `<tr><td class="strong">${esc(p.razao_social)}<div class="muted" style="font-weight:400">${esc(p.cidade || '')}${p.uf ? '/' + esc(p.uf) : ''}</div></td>
            <td class="muted nowrap">${esc(p.cnpj)}</td><td>${esc(p.tipo)}</td><td>${esc(p.atividade || '—')}</td>
            <td>${r.aprov}/${r.exig} aprovados ${alert}</td><td>${badge(p.status)}</td>
            <td><div class="row-actions"><button class="btn sm" data-ver="${p.id}">Analisar</button></div></td></tr>`;
        }).join('') || '<tr><td colspan="7" class="empty">Nenhum parceiro neste filtro.</td></tr>'}</tbody>
      </table></div>
    </div>`;
  $$('#filtro button', view).forEach(b => b.onclick = () => { parcFiltro = b.dataset.s; renderParceiros(view, db); });
  $$('[data-ver]', view).forEach(b => b.onclick = () => abrirParceiro(db, +b.dataset.ver));
  $('#novo', view).onclick = () => formParceiro(null, async data => { await Api.create('parceiros', data); toast('Parceiro cadastrado'); refresh(); });
}

function formParceiro(p, onSave, title = 'Novo parceiro') {
  p = p || {};
  modal({
    title,
    body: `<form class="form" id="fp">
      <div class="field full"><label>Razão social <span class="req">*</span></label><input class="input" name="razao_social" required value="${esc(p.razao_social)}"></div>
      <div class="field"><label>CNPJ <span class="req">*</span></label><input class="input" name="cnpj" required placeholder="00.000.000/0000-00" value="${esc(p.cnpj)}"></div>
      <div class="field"><label>Tipo de parceiro <span class="req">*</span></label><select class="input" name="tipo" required>${options(TIPOS_PARCEIRO, p.tipo)}</select></div>
      <div class="field"><label>Atividade / tecnologia</label><input class="input" name="atividade" placeholder="Ex.: Reciclagem de metais" value="${esc(p.atividade)}"></div>
      <div class="field"><label>Cidade / UF</label><div style="display:flex;gap:8px"><input class="input" name="cidade" value="${esc(p.cidade)}"><input class="input" name="uf" maxlength="2" style="width:70px" value="${esc(p.uf)}"></div></div>
      <div class="field"><label>Contato responsável</label><input class="input" name="contato_nome" value="${esc(p.contato_nome)}"></div>
      <div class="field"><label>E-mail</label><input class="input" type="email" name="email" value="${esc(p.email)}"></div>
      <div class="field"><label>Telefone</label><input class="input" name="telefone" value="${esc(p.telefone)}"></div>
    </form>`,
    actions: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="salvar">Salvar</button>',
    onMount(el, close) {
      $('#salvar', el).onclick = async () => {
        const f = $('#fp', el);
        if (!f.reportValidity()) return;
        try { await onSave(formData(f)); close(); } catch (e) { toast(e.message, true); }
      };
    },
  });
}

function abrirParceiro(db, id) {
  const p = db.byId('parceiros', id);
  const r = docResumo(db, p);
  const faltando = docsExigidos(p.tipo).filter(t => !r.docs.some(d => d.tipo === t));
  modal({
    title: p.razao_social, wide: true,
    body: `
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">${badge(p.status)}${p.enviado_em ? `<span class="hint">Documentação enviada em ${fmtD(p.enviado_em)}</span>` : ''}</div>
      <dl class="kv">
        <dt>CNPJ</dt><dd>${esc(p.cnpj)}</dd><dt>Tipo</dt><dd>${esc(p.tipo)}</dd><dt>Atividade</dt><dd>${esc(p.atividade || '—')}</dd>
        <dt>Localização</dt><dd>${esc(p.cidade || '—')}/${esc(p.uf || '')}</dd><dt>Contato</dt><dd>${esc(p.contato_nome || '—')} · ${esc(p.email || '')} · ${esc(p.telefone || '')}</dd>
      </dl>
      <h4 style="margin:20px 0 8px">Documentos</h4>
      ${faltando.length ? `<div class="banner warn" style="margin-bottom:10px">${ICON.alert}<div>Documentos obrigatórios não enviados: <strong>${faltando.map(esc).join(', ')}</strong></div></div>` : ''}
      <div class="table-wrap card" style="box-shadow:none"><table class="t"><thead><tr><th>Documento</th><th>Número</th><th>Validade</th><th>Arquivo</th><th>Análise</th><th></th></tr></thead><tbody>
      ${r.docs.map(d => `<tr><td class="strong">${esc(d.tipo)}</td><td class="muted">${esc(d.numero || '—')}</td><td>${validadeBadge(d.validade)}</td>
        <td>${d.arquivo && !Api.MOCK ? `<a href="/uploads/${encodeURIComponent(d.arquivo)}" target="_blank">${esc(d.nome_arquivo || 'arquivo')}</a>` : `<span class="muted">${esc(d.nome_arquivo || '—')}</span>`}</td>
        <td>${badge(d.status)}</td>
        <td><div class="row-actions"><button class="btn sm" data-doc="${d.id}" data-st="Aprovado">${ICON.check}Aprovar</button><button class="btn sm danger" data-doc="${d.id}" data-st="Reprovado">Reprovar</button></div></td></tr>`).join('') || '<tr><td colspan="6" class="empty">Nenhum documento enviado.</td></tr>'}
      </tbody></table></div>
      <div class="field" style="margin-top:16px"><label>Parecer / observação para o parceiro</label><textarea class="input" id="obs" rows="2">${esc(p.observacao || '')}</textarea></div>`,
    actions: `<button class="btn" id="editar">Editar dados</button><span style="flex:1"></span>
      <button class="btn danger" id="reprovar">Reprovar cadastro</button>
      <button class="btn primary" id="homologar">${ICON.check} Homologar parceiro</button>`,
    onMount(el, close) {
      $$('[data-doc]', el).forEach(b => b.onclick = async () => {
        await Api.update('documentos', +b.dataset.doc, { status: b.dataset.st });
        App.db = await Api.loadAll(); close(); abrirParceiro(App.db, id); toast(`Documento ${b.dataset.st.toLowerCase()}`);
      });
      const set = async status => {
        if (status === 'Homologado') {
          const pend = db.documentos.filter(d => d.parceiro_id === id && d.status !== 'Aprovado').length;
          if (pend || faltando.length) { toast('Aprove todos os documentos obrigatórios antes de homologar', true); return; }
        }
        await Api.update('parceiros', id, { status, observacao: $('#obs', el).value });
        close(); toast(`Parceiro ${status.toLowerCase()}`); refresh();
      };
      $('#homologar', el).onclick = () => set('Homologado');
      $('#reprovar', el).onclick = () => set('Reprovado');
      $('#editar', el).onclick = () => { close(); formParceiro(p, async data => { await Api.update('parceiros', id, data); toast('Dados atualizados'); refresh(); }, 'Editar parceiro'); };
    },
  });
}
</script><script>/* Portal do Parceiro: o transportador/destinador cadastra a empresa,
   anexa os documentos e envia para análise da empresa cliente. */
function portalHeader(db) {
  if (!App.parceiroId) App.parceiroId = (db.parceiros.find(p => p.status === 'Rascunho') || db.parceiros[0])?.id;
  return `<div class="card card-pad" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
    <div style="width:42px;height:42px;border-radius:12px;background:var(--teal-soft);color:var(--deep);display:grid;place-items:center">${ICON.user}</div>
    <div style="flex:1;min-width:220px"><div class="hint">Acesso simulado do MVP — entrar como:</div>
      <select class="input" id="quem" style="max-width:420px;margin-top:4px">${options(db.parceiros.map(p => [p.id, p.razao_social]), App.parceiroId)}</select></div>
    <button class="btn" id="novoCad">${ICON.plus} Solicitar novo cadastro</button>
  </div>`;
}
function bindPortalHeader(view, db, rerender) {
  $('#quem', view).onchange = e => { App.parceiroId = +e.target.value; rerender(view, db); };
  $('#novoCad', view).onclick = () => formParceiro(null, async data => {
    const novo = await Api.create('parceiros', { ...data, status: 'Rascunho' });
    App.parceiroId = novo.id; toast('Cadastro iniciado — agora anexe seus documentos'); location.hash = '#portal-docs'; refresh();
  }, 'Solicitar cadastro como parceiro');
}
function portalSteps(db, p) {
  const docs = db.documentos.filter(d => d.parceiro_id === p.id);
  const falt = docsExigidos(p.tipo).filter(t => !docs.some(d => d.tipo === t));
  const enviado = p.status !== 'Rascunho';
  const st = [
    { t: 'Dados da empresa', s: 'Razão social, CNPJ, contato', done: !!(p.razao_social && p.cnpj) },
    { t: 'Documentos', s: falt.length ? `${falt.length} obrigatório(s) pendente(s)` : 'Todos anexados', done: !falt.length },
    { t: `Enviar para ${CLIENTE.nome.split(' ')[0]}`, s: enviado ? `Enviado em ${fmtD(p.enviado_em)}` : 'Aguardando envio', done: enviado },
    { t: 'Homologação', s: p.status === 'Homologado' ? 'Aprovado' : p.status === 'Reprovado' ? 'Reprovado' : 'Análise do cliente', done: p.status === 'Homologado' },
  ];
  const cur = st.findIndex(x => !x.done);
  return `<div class="steps">${st.map((x, i) => `<div class="step ${x.done ? 'done' : ''} ${i === cur ? 'current' : ''}"><div class="n">${x.done ? '✓' : i + 1}</div><div><strong>${x.t}</strong><small>${x.s}</small></div></div>`).join('')}</div>`;
}
function statusBanner(p) {
  const m = {
    Rascunho: ['info', ICON.info, 'Cadastro em preenchimento. Complete os dados, anexe os documentos e clique em <strong>Enviar para análise</strong>.'],
    'Em análise': ['warn', ICON.clock, `Documentação enviada em ${fmtD(p.enviado_em)}. A equipe de Meio Ambiente da ${CLIENTE.nome} está analisando.`],
    Homologado: ['ok', ICON.check, `Empresa homologada como fornecedora de serviços ambientais da ${CLIENTE.nome}. Mantenha os documentos dentro da validade.`],
    Reprovado: ['bad', ICON.alert, `Cadastro reprovado. ${p.observacao ? 'Parecer: ' + esc(p.observacao) : ''} Corrija os documentos e reenvie.`],
  }[p.status] || ['info', ICON.info, ''];
  return `<div class="banner ${m[0]}">${m[1]}<div>${m[2]}</div></div>`;
}

function renderPortal(view, db) {
  const head = portalHeader(db);
  const p = db.byId('parceiros', App.parceiroId);
  view.innerHTML = `${head}${statusBanner(p)}${portalSteps(db, p)}
    <div class="card">
      <div class="card-head"><div><h2>Dados da empresa</h2><p>Informações usadas na emissão das MTRs e na homologação</p></div></div>
      <form class="form card-pad" id="fdados">
        <div class="field full"><label>Razão social <span class="req">*</span></label><input class="input" name="razao_social" required value="${esc(p.razao_social)}"></div>
        <div class="field"><label>CNPJ <span class="req">*</span></label><input class="input" name="cnpj" required value="${esc(p.cnpj)}"></div>
        <div class="field"><label>Tipo de parceiro</label><select class="input" name="tipo">${options(TIPOS_PARCEIRO, p.tipo)}</select></div>
        <div class="field"><label>Atividade / tecnologia de tratamento</label><input class="input" name="atividade" value="${esc(p.atividade)}"></div>
        <div class="field"><label>Cidade / UF</label><div style="display:flex;gap:8px"><input class="input" name="cidade" value="${esc(p.cidade)}"><input class="input" name="uf" maxlength="2" style="width:70px" value="${esc(p.uf)}"></div></div>
        <div class="field"><label>Contato responsável</label><input class="input" name="contato_nome" value="${esc(p.contato_nome)}"></div>
        <div class="field"><label>E-mail</label><input class="input" name="email" type="email" value="${esc(p.email)}"></div>
        <div class="field"><label>Telefone</label><input class="input" name="telefone" value="${esc(p.telefone)}"></div>
        <div class="full toolbar"><span class="spacer"></span><button type="button" class="btn" id="salvar">Salvar dados</button><a class="btn primary" href="#portal-docs">Próximo: documentos →</a></div>
      </form>
    </div>`;
  bindPortalHeader(view, db, renderPortal);
  $('#salvar', view).onclick = async () => {
    const f = $('#fdados', view); if (!f.reportValidity()) return;
    await Api.update('parceiros', p.id, formData(f)); toast('Dados salvos'); refresh();
  };
}

function renderPortalDocs(view, db) {
  const head = portalHeader(db);
  const p = db.byId('parceiros', App.parceiroId);
  const docs = db.documentos.filter(d => d.parceiro_id === p.id);
  const exig = docsExigidos(p.tipo);
  const falt = exig.filter(t => !docs.some(d => d.tipo === t));
  const podeEnviar = !falt.length && (p.status === 'Rascunho' || p.status === 'Reprovado');
  view.innerHTML = `${head}${statusBanner(p)}${portalSteps(db, p)}
    <div class="grid g-2-1">
      <div class="card">
        <div class="card-head"><div><h2>Documentos anexados</h2><p>${docs.length} documento(s) · ${exig.length} obrigatório(s) para ${esc(p.tipo.toLowerCase())}</p></div></div>
        <div class="table-wrap" style="margin-top:12px"><table class="t"><thead><tr><th>Documento</th><th>Validade</th><th>Arquivo</th><th>Situação</th><th></th></tr></thead><tbody>
        ${exig.map(t => {
          const d = docs.find(x => x.tipo === t);
          return d ? `<tr><td class="strong">${esc(t)}<div class="muted" style="font-weight:400">Nº ${esc(d.numero || '—')}</div></td><td>${validadeBadge(d.validade)}</td>
            <td class="muted">${esc(d.nome_arquivo || '—')}</td><td>${badge(d.status)}</td><td><div class="row-actions"><button class="btn sm ghost" data-del="${d.id}" title="Remover">${ICON.trash}</button></div></td></tr>`
            : `<tr><td class="strong">${esc(t)}</td><td colspan="3"><span class="badge b-bad">Obrigatório · não enviado</span></td><td><div class="row-actions"><button class="btn sm" data-add="${esc(t)}">${ICON.upload}Anexar</button></div></td></tr>`;
        }).join('')}
        ${docs.filter(d => !exig.includes(d.tipo)).map(d => `<tr><td class="strong">${esc(d.tipo)}</td><td>${validadeBadge(d.validade)}</td><td class="muted">${esc(d.nome_arquivo || '—')}</td><td>${badge(d.status)}</td><td><div class="row-actions"><button class="btn sm ghost" data-del="${d.id}">${ICON.trash}</button></div></td></tr>`).join('')}
        </tbody></table></div>
        <div class="card-pad toolbar" style="border-top:1px solid var(--line)">
          <span class="hint">${falt.length ? `Faltam ${falt.length} documento(s) obrigatório(s).` : p.status === 'Rascunho' || p.status === 'Reprovado' ? 'Tudo pronto para enviar.' : 'Documentação já enviada.'}</span>
          <span class="spacer"></span>
          <button class="btn primary" id="enviar" ${podeEnviar ? '' : 'disabled'}>${ICON.send} Enviar para análise da ${CLIENTE.nome.split(' ').slice(0, 2).join(' ')}</button>
        </div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>Anexar documento</h2><p>PDF, PNG ou JPG</p></div></div>
        <form class="card-pad" id="fdoc" style="display:flex;flex-direction:column;gap:12px">
          <div class="field"><label>Tipo de documento <span class="req">*</span></label><select class="input" name="tipo" required>${options([...exig, 'Certificado de Regularidade (outro)', 'Contrato Social'], falt[0])}</select></div>
          <div class="field"><label>Número</label><input class="input" name="numero" placeholder="Ex.: LO 12345/2026"></div>
          <div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>Emissão</label><input class="input" type="date" name="emissao"></div>
          <div class="field" style="flex:1"><label>Validade <span class="req">*</span></label><input class="input" type="date" name="validade" required></div></div>
          <label class="dropzone" id="dz">${ICON.upload}<div><strong>Clique para selecionar</strong> ou arraste o arquivo aqui</div><div class="hint" id="fname">Nenhum arquivo selecionado</div>
            <input type="file" name="arquivo" accept=".pdf,.png,.jpg,.jpeg" hidden></label>
          <button class="btn dark" type="submit">${ICON.upload} Anexar documento</button>
        </form>
      </div>
    </div>`;
  bindPortalHeader(view, db, renderPortalDocs);
  const fdoc = $('#fdoc', view), file = $('input[type=file]', fdoc), dz = $('#dz', view);
  file.onchange = () => { $('#fname', view).textContent = file.files[0]?.name || 'Nenhum arquivo selecionado'; };
  ['dragover', 'dragenter'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('drag'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, () => dz.classList.remove('drag')));
  dz.addEventListener('drop', e => { e.preventDefault(); file.files = e.dataTransfer.files; file.onchange(); });
  $$('[data-add]', view).forEach(b => b.onclick = () => { $('select[name=tipo]', fdoc).value = b.dataset.add; $('input[name=numero]', fdoc).focus(); });
  fdoc.onsubmit = async e => {
    e.preventDefault(); if (!fdoc.reportValidity()) return;
    const fd = new FormData(fdoc); fd.append('parceiro_id', p.id);
    try { await Api.upload(fd); toast('Documento anexado'); refresh(); } catch (err) { toast(err.message, true); }
  };
  $$('[data-del]', view).forEach(b => b.onclick = async () => { await Api.remove('documentos', +b.dataset.del); toast('Documento removido'); refresh(); });
  $('#enviar', view).onclick = async () => {
    const hoje = isoDate(TODAY);
    await Api.update('parceiros', p.id, { status: 'Em análise', enviado_em: hoje });
    await Promise.all(docs.map(d => Api.update('documentos', d.id, { enviado_em: hoje, status: d.status === 'Reprovado' ? 'Pendente' : d.status })));
    toast(`Documentação enviada para ${CLIENTE.nome}`); refresh();
  };
}
</script><script>/* Resíduos: inventário (cadastro) e lançamento da geração semanal. */
let resTab = 'inventario';
let resSemana = null;

function renderResiduos(view, db) {
  if (App.subTab === 'semana') { resTab = 'semana'; App.subTab = null; }
  const semanas = [...new Set(db.geracoes.map(g => g.semana))].sort();
  const ult8 = semanas.slice(-8);
  const qtd = (rid, s) => db.geracoes.find(g => g.residuo_id === rid && g.semana === s)?.quantidade;

  view.innerHTML = `
    <div class="tabs"><button data-t="inventario" class="${resTab === 'inventario' ? 'on' : ''}">Inventário de resíduos</button><button data-t="semana" class="${resTab === 'semana' ? 'on' : ''}">Geração semanal</button></div>
    <div id="tab"></div>`;
  $$('.tabs button', view).forEach(b => b.onclick = () => { resTab = b.dataset.t; renderResiduos(view, db); bindTips(view); });
  const tab = $('#tab', view);

  if (resTab === 'inventario') {
    const media = rid => { const v = ult8.map(s => qtd(rid, s)).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : 0; };
    tab.innerHTML = `<div class="card">
      <div class="card-head"><div><h2>Resíduos cadastrados</h2><p>${db.residuos.length} resíduos · código conforme Lista Brasileira de Resíduos (IBAMA) · classe ABNT NBR 10004</p></div>
        <button class="btn primary" id="novo">${ICON.plus} Cadastrar resíduo</button></div>
      <div class="table-wrap" style="margin-top:14px"><table class="t">
        <thead><tr><th>Resíduo</th><th>Código</th><th>Classe</th><th>Estado</th><th>Área geradora</th><th>Acondicionamento</th><th>Destinação</th><th class="num">Média/semana</th><th></th></tr></thead>
        <tbody>${db.residuos.map(r => `<tr><td class="strong">${esc(r.nome)}</td><td class="muted nowrap">${esc(r.codigo_ibama || "—")}</td><td>${classeTag(r.classe)}</td>
          <td>${esc(r.estado_fisico || '—')}</td><td>${esc(r.area_geradora || '—')}</td><td class="muted">${esc(r.acondicionamento || '—')}</td><td>${esc(r.destinacao || '—')}</td>
          <td class="num">${fmtN(media(r.id))} kg</td><td><div class="row-actions"><button class="btn sm" data-ed="${r.id}">Editar</button></div></td></tr>`).join('')}</tbody>
      </table></div></div>`;
    $('#novo', tab).onclick = () => formResiduo(null);
    $$('[data-ed]', tab).forEach(b => b.onclick = () => formResiduo(db.byId('residuos', +b.dataset.ed)));
    return;
  }

  // ----- geração semanal -----
  const semAtual = mondayOf(TODAY);
  const sugerida = isoDate(new Date(parseD(semAtual).getTime() - 7 * 864e5));
  resSemana = resSemana || sugerida;
  const totSem = s => db.geracoes.filter(g => g.semana === s).reduce((a, g) => a + g.quantidade, 0);
  tab.innerHTML = `<div class="grid g-2-1">
    <div class="card">
      <div class="card-head"><div><h2>Lançar quantidades da semana</h2><p>Informe o total gerado (kg) de cada resíduo na semana de referência</p></div></div>
      <div class="card-pad toolbar">
        <div class="field"><label>Semana iniciada em (segunda-feira)</label><input class="input" type="date" id="sem" value="${resSemana}" style="width:190px"></div>
        <span class="hint" style="align-self:flex-end;padding-bottom:10px">${fmtD(resSemana)} a ${fmtD(isoDate(new Date(parseD(resSemana).getTime() + 6 * 864e5)))}</span>
      </div>
      <form id="flote"><div class="table-wrap"><table class="t">
        <thead><tr><th>Resíduo</th><th>Classe</th><th class="num">Semana anterior</th><th class="num" style="width:180px">Quantidade (kg)</th></tr></thead>
        <tbody>${db.residuos.map(r => {
          const ant = qtd(r.id, isoDate(new Date(parseD(resSemana).getTime() - 7 * 864e5)));
          const v = qtd(r.id, resSemana);
          return `<tr><td class="strong">${esc(r.nome)}</td><td>${classeTag(r.classe)}</td><td class="num muted">${ant != null ? fmtN(ant) + ' kg' : '—'}</td>
            <td class="num"><input class="input" type="number" min="0" step="1" name="r${r.id}" value="${v ?? ''}" placeholder="0" style="text-align:right"></td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td colspan="3">Total da semana</td><td class="num" id="totLote">—</td></tr></tfoot>
      </table></div>
      <div class="card-pad toolbar"><span class="spacer"></span><button class="btn primary" type="submit">${ICON.check} Salvar lançamento</button></div></form>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Histórico (t/semana)</h2><p>Últimas ${ult8.length} semanas lançadas</p></div></div>
      <div class="chart">${columnChart({ cats: ult8.map(fmtDs), series: [{ name: 'Total gerado', color: 'var(--teal)', values: ult8.map(s => totSem(s) / 1000) }], fmt: v => fmtN(v, 1), fmtAxis: v => fmtN(v, 0), unit: ' t', height: 260, width: 400 })}</div>
      <div class="table-wrap"><table class="t"><thead><tr><th>Semana</th><th class="num">Total</th><th class="num">Classe I</th></tr></thead><tbody>
        ${ult8.slice().reverse().map(s => `<tr><td>${fmtD(s)}</td><td class="num strong">${fmtT(totSem(s))} t</td><td class="num">${fmtT(db.geracoes.filter(g => g.semana === s && db.byId('residuos', g.residuo_id)?.classe === 'Classe I').reduce((a, g) => a + g.quantidade, 0))} t</td></tr>`).join('')}
      </tbody></table></div>
    </div></div>`;
  const f = $('#flote', tab);
  const tot = () => { $('#totLote', tab).textContent = fmtN($$('input[type=number]', f).reduce((a, i) => a + (+i.value || 0), 0)) + ' kg'; };
  f.oninput = tot; tot();
  $('#sem', tab).onchange = e => { resSemana = mondayOf(parseD(e.target.value)); renderResiduos(view, db); bindTips(view); };
  f.onsubmit = async e => {
    e.preventDefault();
    const itens = db.residuos.map(r => ({ residuo_id: r.id, quantidade: f[`r${r.id}`].value }));
    await Api.lote({ semana: resSemana, itens });
    toast('Geração da semana registrada'); refresh();
  };
}

function formResiduo(r) {
  r = r || {};
  modal({
    title: r.id ? 'Editar resíduo' : 'Cadastrar resíduo',
    body: `<form class="form" id="fr">
      <div class="field full"><label>Nome do resíduo <span class="req">*</span></label><input class="input" name="nome" required value="${esc(r.nome)}"></div>
      <div class="field"><label>Código (Lista Brasileira de Resíduos)</label><input class="input" name="codigo_ibama" placeholder="Ex.: 08 01 13*" value="${esc(r.codigo_ibama)}"></div>
      <div class="field"><label>Classe NBR 10004 <span class="req">*</span></label><select class="input" name="classe" required>${options(['Classe I', 'Classe II A', 'Classe II B'], r.classe)}</select></div>
      <div class="field"><label>Estado físico</label><select class="input" name="estado_fisico">${options(['Sólido', 'Líquido', 'Pastoso', 'Gasoso'], r.estado_fisico)}</select></div>
      <div class="field"><label>Área geradora</label><input class="input" name="area_geradora" placeholder="Ex.: Pintura" value="${esc(r.area_geradora)}"></div>
      <div class="field"><label>Acondicionamento</label><input class="input" name="acondicionamento" placeholder="Ex.: Tambor 200 L" value="${esc(r.acondicionamento)}"></div>
      <div class="field"><label>Destinação prevista</label><select class="input" name="destinacao">${options(DESTINACOES, r.destinacao)}</select></div>
    </form>`,
    actions: `${r.id ? '<button class="btn danger" id="del">Excluir</button><span style="flex:1"></span>' : ''}<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar</button>`,
    onMount(el, close) {
      $('#ok', el).onclick = async () => {
        const f = $('#fr', el); if (!f.reportValidity()) return;
        const d = { ...formData(f), unidade: 'kg' };
        if (r.id) await Api.update('residuos', r.id, d); else await Api.create('residuos', d);
        close(); toast('Resíduo salvo'); refresh();
      };
      if (r.id) $('#del', el).onclick = async () => {
        try { await Api.remove('residuos', r.id); close(); toast('Resíduo excluído'); refresh(); } catch (e) { toast(e.message, true); }
      };
    },
  });
}
</script><script>/* MTR – Manifesto de Transporte de Resíduos: emissão, acompanhamento e baixa com CDF. */
let mtrFiltro = 'Todas';

function mtrItens(db, m) { return db.mtr_itens.filter(i => i.mtr_id === m.id); }
function mtrTotal(db, m) { return mtrItens(db, m).reduce((a, i) => a + i.quantidade, 0); }

function renderMtr(view, db) {
  const ord = db.mtrs.slice().sort((a, b) => b.data_emissao.localeCompare(a.data_emissao) || b.id - a.id);
  const lista = ord.filter(m => mtrFiltro === 'Todas' || m.status === mtrFiltro).slice(0, 30);
  const c = s => db.mtrs.filter(m => m.status === s).length;
  const mes = isoDate(TODAY).slice(0, 7);
  view.innerHTML = `
    <div class="grid g-4">
      <div class="card kpi"><div class="label">Emitidas no mês</div><div class="value">${db.mtrs.filter(m => m.data_emissao.startsWith(mes)).length}</div><div class="foot">${fmtMes(mes)}</div></div>
      <div class="card kpi"><div class="label">Aguardando coleta</div><div class="value">${c('Emitido')}</div><div class="foot">Status “Emitido”</div></div>
      <div class="card kpi"><div class="label">Em transporte</div><div class="value">${c('Em transporte')}</div><div class="foot">Aguardando recebimento</div></div>
      <div class="card kpi"><div class="label">Concluídas com CDF</div><div class="value">${c('Recebido')}</div><div class="foot">Certificado de Destinação Final</div></div>
    </div>
    <div class="card">
      <div class="card-head">
        <div class="seg" id="filtro">${['Todas', 'Emitido', 'Em transporte', 'Recebido', 'Cancelado'].map(s => `<button class="${mtrFiltro === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('')}</div>
        <button class="btn primary" id="emitir">${ICON.plus} Emitir MTR</button>
      </div>
      <div class="table-wrap" style="margin-top:14px"><table class="t">
        <thead><tr><th>Número</th><th>Emissão</th><th>Resíduo(s)</th><th class="num">Quantidade</th><th>Transportador</th><th>Destinador</th><th>Status</th><th></th></tr></thead>
        <tbody>${lista.map(m => {
          const it = mtrItens(db, m);
          return `<tr><td class="strong nowrap">${esc(m.numero)}</td><td class="nowrap">${fmtD(m.data_emissao)}</td>
            <td>${it.map(i => esc(db.byId('residuos', i.residuo_id)?.nome)).join('<br>')}</td>
            <td class="num">${fmtN(mtrTotal(db, m))} kg</td>
            <td class="muted">${esc(db.byId('parceiros', m.transportador_id)?.razao_social || '—')}</td>
            <td class="muted">${esc(db.byId('parceiros', m.destinador_id)?.razao_social || '—')}</td>
            <td>${badge(m.status)}${m.cdf_numero ? `<div class="muted" style="font-size:11.5px;margin-top:3px">${esc(m.cdf_numero)}</div>` : ''}</td>
            <td><div class="row-actions"><button class="btn sm" data-ver="${m.id}">${ICON.doc}Abrir</button>${m.status === 'Emitido' || m.status === 'Em transporte' ? `<button class="btn sm" data-st="${m.id}">Atualizar</button>` : ''}</div></td></tr>`;
        }).join('') || '<tr><td colspan="8" class="empty">Nenhuma MTR neste filtro.</td></tr>'}</tbody>
      </table></div>
      ${ord.length > 30 ? '<div class="card-pad hint">Exibindo as 30 MTRs mais recentes do filtro.</div>' : ''}
    </div>`;
  $$('#filtro button', view).forEach(b => b.onclick = () => { mtrFiltro = b.dataset.s; renderMtr(view, db); });
  $('#emitir', view).onclick = () => formMtr(db);
  $$('[data-ver]', view).forEach(b => b.onclick = () => verMtr(db, +b.dataset.ver));
  $$('[data-st]', view).forEach(b => b.onclick = () => statusMtr(db, +b.dataset.st));
}

function docsProblema(db, pid) {
  return db.documentos.filter(d => d.parceiro_id === pid && d.validade && daysUntil(d.validade) < 0);
}

function formMtr(db) {
  const homolog = db.parceiros.filter(p => p.status === 'Homologado');
  const transp = homolog.filter(p => p.tipo.includes('Transportador'));
  const dest = homolog.filter(p => p.tipo.includes('Destinador'));
  const resOpts = db.residuos.map(r => [r.id, `${r.nome} (${r.classe})`]);
  const linha = () => `<tr><td><select class="input" name="residuo_id" required>${options(resOpts, '', 'Selecione o resíduo')}</select></td>
    <td><input class="input" name="quantidade" type="number" min="1" placeholder="kg" required style="text-align:right"></td>
    <td><input class="input" name="acondicionamento" placeholder="Acondicionamento"></td>
    <td><button type="button" class="btn sm ghost" data-rm>${ICON.trash}</button></td></tr>`;
  modal({
    title: 'Emitir Manifesto de Transporte de Resíduos', wide: true,
    body: `<form id="fm">
      <div class="banner info" style="margin-bottom:16px">${ICON.info}<div><strong>Gerador:</strong> ${CLIENTE.nome} — CNPJ ${CLIENTE.cnpj}<br><span class="hint" style="color:inherit">${CLIENTE.endereco}</span></div></div>
      <div class="form">
        <div class="field"><label>Transportador <span class="req">*</span></label><select class="input" name="transportador_id" required>${options(transp.map(p => [p.id, p.razao_social]), '', 'Selecione')}</select></div>
        <div class="field"><label>Destinador <span class="req">*</span></label><select class="input" name="destinador_id" required>${options(dest.map(p => [p.id, `${p.razao_social} — ${p.atividade || ''}`]), '', 'Selecione')}</select></div>
        <div class="full" id="avisoDoc"></div>
        <div class="field"><label>Data de emissão</label><input class="input" type="date" name="data_emissao" value="${isoDate(TODAY)}"></div>
        <div class="field"><label>Placa do veículo</label><input class="input" name="placa" placeholder="ABC-1D23"></div>
        <div class="field"><label>Motorista</label><input class="input" name="motorista"></div>
        <div class="field"><label>Observação</label><input class="input" name="observacao"></div>
      </div>
      <h4 style="margin:20px 0 8px">Resíduos transportados</h4>
      <table class="t"><thead><tr><th>Resíduo</th><th style="width:140px">Quantidade (kg)</th><th>Acondicionamento</th><th></th></tr></thead><tbody id="itens">${linha()}</tbody></table>
      <button type="button" class="btn sm" id="addItem" style="margin-top:10px">${ICON.plus} Adicionar resíduo</button>
      <p class="hint" style="margin-top:14px">Somente parceiros <strong>homologados</strong> aparecem na lista. No MVP a MTR é gerada na plataforma; a integração com o SINIR/MTR nacional está prevista no roadmap.</p>
    </form>`,
    actions: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Emitir MTR</button>',
    onMount(el, close) {
      const tb = $('#itens', el);
      $('#addItem', el).onclick = () => tb.insertAdjacentHTML('beforeend', linha());
      tb.onclick = e => { if (e.target.closest('[data-rm]') && tb.rows.length > 1) e.target.closest('tr').remove(); };
      tb.onchange = e => {
        if (e.target.name === 'residuo_id') {
          const r = db.byId('residuos', e.target.value);
          const ac = e.target.closest('tr').querySelector('[name=acondicionamento]');
          if (r && !ac.value) ac.value = r.acondicionamento || '';
        }
      };
      const aviso = () => {
        const ids = ['transportador_id', 'destinador_id'].map(n => +$(`[name=${n}]`, el).value).filter(Boolean);
        const prob = ids.flatMap(id => docsProblema(db, id).map(d => `${db.byId('parceiros', id).razao_social}: ${d.tipo} vencido em ${fmtD(d.validade)}`));
        $('#avisoDoc', el).innerHTML = prob.length ? `<div class="banner bad">${ICON.alert}<div><strong>Atenção — documento vencido.</strong><br>${prob.map(esc).join('<br>')}</div></div>` : '';
      };
      $$('[name=transportador_id],[name=destinador_id]', el).forEach(s => s.onchange = aviso);
      $('#ok', el).onclick = async () => {
        const f = $('#fm', el); if (!f.reportValidity()) return;
        const d = formData(f);
        d.itens = [...tb.rows].map(tr => ({ residuo_id: +tr.querySelector('[name=residuo_id]').value, quantidade: +tr.querySelector('[name=quantidade]').value, acondicionamento: tr.querySelector('[name=acondicionamento]').value }));
        delete d.residuo_id; delete d.quantidade; delete d.acondicionamento;
        try {
          const m = await Api.emitirMtr(d);
          close(); toast(`${m.numero} emitida`);
          App.db = await Api.loadAll(); await refresh(); verMtr(App.db, m.id);
        } catch (e) { toast(e.message, true); }
      };
    },
  });
}

function verMtr(db, id) {
  const m = db.byId('mtrs', id);
  const t = db.byId('parceiros', m.transportador_id) || {};
  const d = db.byId('parceiros', m.destinador_id) || {};
  const it = mtrItens(db, m);
  const kv = (l, v) => `<div><span>${l}</span>${esc(v || '—')}</div>`;
  modal({
    title: m.numero, wide: true,
    body: `<div class="mtr-doc">
      <div class="hd"><div style="display:flex;gap:12px;align-items:center"><div style="width:44px;background:var(--deep);border-radius:10px;padding:5px">${LOGO_BRANCO}</div>
        <div><h4>Manifesto de Transporte de Resíduos</h4><div style="font-size:11.5px;color:#59665F">Emitido via Ciclora EHS · ${esc(CLIENTE.nome)}</div></div></div>
        <div><div class="num">${esc(m.numero)}</div><div style="text-align:right;font-size:11.5px">Emissão: ${fmtD(m.data_emissao)} · ${badge(m.status)}</div></div></div>
      <section><h5>1. Gerador</h5><div class="in">${kv('Razão social', CLIENTE.nome)}${kv('CNPJ', CLIENTE.cnpj)}${kv('Unidade', CLIENTE.unidade)}${kv('Endereço', CLIENTE.endereco)}${kv('Responsável', CLIENTE.responsavel)}</div></section>
      <section><h5>2. Transportador</h5><div class="in">${kv('Razão social', t.razao_social)}${kv('CNPJ', t.cnpj)}${kv('Município/UF', `${t.cidade || ''}/${t.uf || ''}`)}${kv('Placa', m.placa)}${kv('Motorista', m.motorista)}${kv('Contato', t.telefone)}</div></section>
      <section><h5>3. Destinador</h5><div class="in">${kv('Razão social', d.razao_social)}${kv('CNPJ', d.cnpj)}${kv('Município/UF', `${d.cidade || ''}/${d.uf || ''}`)}${kv('Tecnologia', d.atividade)}${kv('Data de recebimento', fmtD(m.data_recebimento))}${kv('CDF', m.cdf_numero)}</div></section>
      <section><h5>4. Resíduos</h5><table><thead><tr><th>Código</th><th>Descrição</th><th>Classe</th><th>Estado</th><th>Acondicionamento</th><th style="text-align:right">Quantidade</th></tr></thead><tbody>
        ${it.map(i => { const r = db.byId('residuos', i.residuo_id) || {}; return `<tr><td>${esc(r.codigo_ibama)}</td><td>${esc(r.nome)}</td><td>${esc(r.classe)}</td><td>${esc(r.estado_fisico)}</td><td>${esc(i.acondicionamento || r.acondicionamento)}</td><td style="text-align:right">${fmtN(i.quantidade)} kg</td></tr>`; }).join('')}
        <tr><td colspan="5"><strong>Total</strong></td><td style="text-align:right"><strong>${fmtN(mtrTotal(db, m))} kg</strong></td></tr></tbody></table></section>
      ${m.observacao ? `<section><h5>Observações</h5><div style="padding:8px 10px">${esc(m.observacao)}</div></section>` : ''}
      <div class="sign"><div>Gerador</div><div>Transportador</div><div>Destinador (recebimento)</div></div>
    </div>`,
    actions: Api.MOCK ? '<span class="hint" style="margin-right:auto">No sistema instalado, este documento é impresso ou salvo em PDF.</span><button class="btn" data-close>Fechar</button>'
      : `<button class="btn" data-close>Fechar</button><button class="btn dark" id="imp">${ICON.print} Imprimir / salvar PDF</button>`,
    onMount(el) { const b = $('#imp', el); if (b) b.onclick = () => window.print(); },
  });
}

function statusMtr(db, id) {
  const m = db.byId('mtrs', id);
  modal({
    title: `Atualizar ${m.numero}`,
    body: `<form class="form" id="fs">
      <div class="field full"><label>Novo status</label><select class="input" name="status">${options(['Emitido', 'Em transporte', 'Recebido', 'Cancelado'], m.status === 'Emitido' ? 'Em transporte' : 'Recebido')}</select></div>
      <div class="field"><label>Data de recebimento</label><input class="input" type="date" name="data_recebimento" value="${isoDate(TODAY)}"></div>
      <div class="field"><label>Nº do CDF (Certificado de Destinação Final)</label><input class="input" name="cdf_numero" placeholder="CDF-2026-00000"></div>
      <p class="hint full">Ao marcar como <strong>Recebido</strong>, informe o CDF emitido pelo destinador para comprovar a destinação ambientalmente adequada.</p>
    </form>`,
    actions: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar</button>',
    onMount(el, close) {
      $('#ok', el).onclick = async () => {
        const d = formData($('#fs', el));
        if (d.status !== 'Recebido') { d.data_recebimento = null; d.cdf_numero = null; }
        else if (!d.cdf_numero) { toast('Informe o número do CDF', true); return; }
        await Api.update('mtrs', id, d); close(); toast('MTR atualizada'); refresh();
      };
    },
  });
}
</script><script>/* Financeiro: lançamentos de custos e receitas ligados aos resíduos. */
const CATEGORIAS = {
  Custo: ['Destinação final', 'Transporte', 'Locação de caçambas/contêineres', 'Análises laboratoriais', 'Taxas e licenças', 'Outros custos'],
  Receita: ['Venda de recicláveis', 'Venda de sucata metálica', 'Créditos de logística reversa', 'Outras receitas'],
};
let finMes = 'todos', finTipo = 'Todos', finLimit = 25;

function renderFinanceiro(view, db) {
  const meses = [...new Set(db.financeiro.map(f => f.data.slice(0, 7)))].sort();
  const base = db.financeiro.filter(f => finMes === 'todos' || f.data.startsWith(finMes));
  const lista = base.filter(f => finTipo === 'Todos' || f.tipo === finTipo).sort((a, b) => b.data.localeCompare(a.data) || b.id - a.id);
  const sum = arr => arr.reduce((a, f) => a + f.valor, 0);
  const receita = sum(base.filter(f => f.tipo === 'Receita'));
  const custo = sum(base.filter(f => f.tipo === 'Custo'));
  const ton = db.geracoes.filter(g => finMes === 'todos' || g.semana.startsWith(finMes)).reduce((a, g) => a + g.quantidade, 0) / 1000;
  const porCat = Object.entries(base.reduce((o, f) => { const k = f.tipo + '|' + f.categoria; o[k] = (o[k] || 0) + f.valor; return o; }, {}))
    .map(([k, v]) => ({ label: k.split('|')[1], value: v, color: k.startsWith('Receita') ? 'var(--s-iia)' : 'var(--s-i)', sub: k.split('|')[0] }))
    .sort((a, b) => b.value - a.value);
  const ult = meses.slice(-6);
  const series = [
    { name: 'Receita', color: 'var(--s-iia)', values: ult.map(m => sum(db.financeiro.filter(f => f.tipo === 'Receita' && f.data.startsWith(m)))) },
    { name: 'Custo', color: 'var(--s-i)', values: ult.map(m => sum(db.financeiro.filter(f => f.tipo === 'Custo' && f.data.startsWith(m)))) },
  ];
  const shown = lista.slice(0, finLimit);

  view.innerHTML = `
    <div class="toolbar">
      <div class="field"><label>Competência</label><select class="input" id="mes" style="width:200px">${options([['todos', 'Todo o período'], ...meses.slice().reverse().map(m => [m, fmtMes(m)])], finMes)}</select></div>
      <span class="spacer"></span>
      <button class="btn primary" id="novo" style="align-self:flex-end">${ICON.plus} Novo lançamento</button>
    </div>
    <div class="grid g-4">
      <div class="card kpi"><div class="label">Receitas</div><div class="value" style="color:var(--ok)">${fmtBRL(receita)}</div><div class="foot">Venda de recicláveis e sucata</div></div>
      <div class="card kpi"><div class="label">Custos</div><div class="value">${fmtBRL(custo)}</div><div class="foot">Transporte, destinação, locação, análises</div></div>
      <div class="card kpi accent"><div class="label">Saldo</div><div class="value">${fmtBRL(receita - custo)}</div><div class="foot">${receita >= custo ? 'Resíduos geram resultado positivo' : 'Resultado negativo no período'}</div></div>
      <div class="card kpi"><div class="label">Custo por tonelada gerada</div><div class="value">${fmtBRL(ton ? custo / ton : 0)}</div><div class="foot">${fmtN(ton, 1)} t no período</div></div>
    </div>
    <div class="grid g-2">
      <div class="card"><div class="card-head"><div><h2>Receita × custo por mês</h2><p>Últimos ${ult.length} meses</p></div></div>${legend(series)}
        <div class="chart">${columnChart({ cats: ult.map(fmtMes), series, mode: 'group', width: 560, fmt: fmtBRL, fmtAxis: v => fmtBRLk(v).replace('R$ ', '') })}</div></div>
      <div class="card"><div class="card-head"><div><h2>Por categoria</h2><p><span style="color:var(--s-iia)">■</span> receita · <span style="color:var(--s-i)">■</span> custo — ${finMes === 'todos' ? 'todo o período' : fmtMes(finMes)}</p></div></div>
        <div class="chart" style="padding-top:14px">${barList({ items: porCat, fmt: v => fmtBRLk(v), width: 520 })}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><div class="seg" id="tipo">${['Todos', 'Receita', 'Custo'].map(s => `<button class="${finTipo === s ? 'on' : ''}" data-s="${s}">${s === 'Todos' ? 'Todos' : s + 's'}</button>`).join('')}</div><span class="hint">${lista.length} lançamento(s)${lista.length > finLimit ? ` · exibindo ${finLimit}` : ''}</span></div>
      <div class="table-wrap" style="margin-top:14px"><table class="t">
        <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Parceiro</th><th>MTR</th><th>NF</th><th class="num">Valor</th><th></th></tr></thead>
        <tbody>${shown.map(f => `<tr><td class="nowrap">${fmtD(f.data)}</td><td>${badge(f.tipo)}</td><td>${esc(f.categoria)}</td><td>${esc(f.descricao || '—')}</td>
          <td class="muted">${esc(db.byId('parceiros', f.parceiro_id)?.razao_social || '—')}</td><td class="muted nowrap">${esc(db.byId('mtrs', f.mtr_id)?.numero || '—')}</td><td class="muted nowrap">${esc(f.nota_fiscal || '—')}</td>
          <td class="num strong" style="color:${f.tipo === 'Receita' ? 'var(--ok)' : 'inherit'}">${f.tipo === 'Custo' ? '−' : '+'} ${fmtBRL(f.valor)}</td>
          <td><div class="row-actions"><button class="btn sm ghost" data-del="${f.id}" title="Excluir">${ICON.trash}</button></div></td></tr>`).join('') || '<tr><td colspan="9" class="empty">Sem lançamentos.</td></tr>'}</tbody>
      </table></div>
      ${lista.length > finLimit ? '<div class="card-pad" style="text-align:center"><button class="btn" id="mais">Mostrar mais lançamentos</button></div>' : ''}
    </div>`;
  $('#mes', view).onchange = e => { finMes = e.target.value; renderFinanceiro(view, db); bindTips(view); };
  $$('#tipo button', view).forEach(b => b.onclick = () => { finTipo = b.dataset.s; renderFinanceiro(view, db); bindTips(view); });
  $('#novo', view).onclick = () => formLancamento(db);
  if ($('#mais', view)) $('#mais', view).onclick = () => { finLimit += 50; renderFinanceiro(view, db); bindTips(view); };
  $$('[data-del]', view).forEach(b => b.onclick = async () => { await Api.remove('financeiro', +b.dataset.del); toast('Lançamento excluído'); refresh(); });
}

function formLancamento(db) {
  const mtrs = db.mtrs.slice().sort((a, b) => b.id - a.id).slice(0, 60);
  modal({
    title: 'Novo lançamento financeiro',
    body: `<form class="form" id="ff">
      <div class="field"><label>Tipo <span class="req">*</span></label><div class="seg" id="tp"><button type="button" class="on" data-v="Custo">Custo</button><button type="button" data-v="Receita">Receita</button></div><input type="hidden" name="tipo" value="Custo"></div>
      <div class="field"><label>Data <span class="req">*</span></label><input class="input" type="date" name="data" required value="${isoDate(TODAY)}"></div>
      <div class="field"><label>Categoria <span class="req">*</span></label><select class="input" name="categoria" id="cat">${options(CATEGORIAS.Custo)}</select></div>
      <div class="field"><label>Valor (R$) <span class="req">*</span></label><input class="input" type="number" step="0.01" min="0.01" name="valor" required></div>
      <div class="field full"><label>Descrição</label><input class="input" name="descricao" placeholder="Ex.: Destinação de borra de tinta – outubro"></div>
      <div class="field"><label>Resíduo</label><select class="input" name="residuo_id">${options(db.residuos.map(r => [r.id, r.nome]), '', '—')}</select></div>
      <div class="field"><label>Parceiro</label><select class="input" name="parceiro_id">${options(db.parceiros.map(p => [p.id, p.razao_social]), '', '—')}</select></div>
      <div class="field"><label>MTR vinculada</label><select class="input" name="mtr_id">${options(mtrs.map(m => [m.id, m.numero]), '', '—')}</select></div>
      <div class="field"><label>Nota fiscal</label><input class="input" name="nota_fiscal" placeholder="NF 00000"></div>
    </form>`,
    actions: '<button class="btn" data-close>Cancelar</button><button class="btn primary" id="ok">Salvar lançamento</button>',
    onMount(el, close) {
      $$('#tp button', el).forEach(b => b.onclick = () => {
        $$('#tp button', el).forEach(x => x.classList.toggle('on', x === b));
        $('[name=tipo]', el).value = b.dataset.v; $('#cat', el).innerHTML = options(CATEGORIAS[b.dataset.v]);
      });
      $('[name=mtr_id]', el).onchange = e => {
        const m = db.byId('mtrs', e.target.value); if (!m) return;
        const it = db.mtr_itens.find(i => i.mtr_id === m.id);
        if (it) $('[name=residuo_id]', el).value = it.residuo_id;
        $('[name=parceiro_id]', el).value = m.destinador_id;
      };
      $('#ok', el).onclick = async () => {
        const f = $('#ff', el); if (!f.reportValidity()) return;
        const d = formData(f);
        d.valor = +d.valor;
        ['residuo_id', 'parceiro_id', 'mtr_id'].forEach(k => { d[k] = d[k] ? +d[k] : null; });
        try { await Api.create('financeiro', d); close(); toast('Lançamento registrado'); refresh(); } catch (e) { toast(e.message, true); }
      };
    },
  });
}
</script><script>/* Roteador e casca da aplicação (SPA com rotas por hash). */
const App = {
  mode: 'cliente',          // 'cliente' (gestor EHS da Kairós) | 'parceiro' (portal do fornecedor)
  parceiroId: null,         // parceiro "logado" no portal
  db: null,
};

const ROUTES = {
  cliente: [
    { id: 'dashboard', label: 'Dashboard', icon: 'dash', title: 'Dashboard de gestão de resíduos', render: renderDashboard },
    { id: 'parceiros', label: 'Parceiros', icon: 'partner', title: 'Parceiros e destinadores', render: renderParceiros },
    { id: 'residuos', label: 'Resíduos', icon: 'waste', title: 'Inventário e geração de resíduos', render: renderResiduos },
    { id: 'mtr', label: 'MTR', icon: 'truck', title: 'Manifestos de Transporte de Resíduos', render: renderMtr },
    { id: 'financeiro', label: 'Financeiro', icon: 'money', title: 'Custos e receitas com resíduos', render: renderFinanceiro },
  ],
  parceiro: [
    { id: 'portal', label: 'Meu cadastro', icon: 'partner', title: 'Portal do Parceiro', render: renderPortal },
    { id: 'portal-docs', label: 'Documentos', icon: 'doc', title: 'Portal do Parceiro · Documentos', render: renderPortalDocs },
  ],
};

function shell() {
  document.body.innerHTML = `
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">${brandWord()}</div>
      <div class="nav-label" id="navLabel"></div>
      <nav class="nav" id="nav"></nav>
      <div class="client-card" id="clientCard"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn ghost menu-btn" id="menuBtn" aria-label="Menu">${ICON.menu}</button>
          <div><h1 id="pageTitle"></h1><div class="sub" id="pageSub"></div></div>
        </div>
        <div class="view-switch" role="tablist" aria-label="Perfil de acesso">
          <button data-mode="cliente">Gestor EHS · Kairós</button>
          <button data-mode="parceiro">Portal do Parceiro</button>
        </div>
      </header>
      <main class="content" id="view"></main>
    </div>
  </div>`;
  $$('.view-switch button').forEach(b => b.onclick = () => {
    App.mode = b.dataset.mode;
    location.hash = App.mode === 'cliente' ? '#dashboard' : '#portal';
  });
  $('#menuBtn').onclick = () => $('#sidebar').classList.toggle('open');
}

function brandWord() {
  return `<div style="display:flex;align-items:center;gap:10px">
    <div style="width:42px">${LOGO_BRANCO}</div>
    <div><div style="font-weight:800;font-size:24px;letter-spacing:-.03em;color:#fff;line-height:1">ciclora</div>
    <div style="font-size:9.5px;letter-spacing:.1em;color:var(--lime);font-weight:600;margin-top:4px">GESTÃO DE RESÍDUOS</div></div></div>`;
}

async function route() {
  let id = location.hash.replace(/^#\/?/, '').split('?')[0] || 'dashboard';
  if (id === 'residuos-semana') { App.subTab = 'semana'; id = 'residuos'; }
  App.mode = id.startsWith('portal') ? 'parceiro' : 'cliente';
  const list = ROUTES[App.mode];
  const r = list.find(x => x.id === id) || list[0];
  $$('.view-switch button').forEach(b => b.classList.toggle('on', b.dataset.mode === App.mode));
  $('#navLabel').textContent = App.mode === 'cliente' ? 'Gestão EHS' : 'Portal do fornecedor';
  $('#nav').innerHTML = list.map(x => `<a href="#${x.id}" class="${x.id === r.id ? 'active' : ''}">${ICON[x.icon]}${x.label}</a>`).join('');
  $('#clientCard').innerHTML = App.mode === 'cliente'
    ? `<strong>${CLIENTE.nome}</strong>${CLIENTE.unidade}<br>${CLIENTE.responsavel}`
    : `<strong>Acesso de parceiro</strong>Envie seus documentos para homologação na ${CLIENTE.nome}`;
  $('#pageTitle').textContent = r.title;
  $('#pageSub').textContent = App.mode === 'cliente' ? `${CLIENTE.nome} · ${CLIENTE.unidade}` : 'Cadastro de transportadores e destinadores de resíduos';
  $('#sidebar').classList.remove('open');
  $$('.modal-bg').forEach(m => m.remove());
  Tip.hide();
  const view = $('#view');
  view.innerHTML = '<div class="empty">Carregando…</div>';
  try {
    App.db = await Api.loadAll();
    await r.render(view, App.db);
    bindTips(view);
  } catch (e) {
    view.innerHTML = `<div class="banner bad">${ICON.alert}<div><strong>Não foi possível carregar os dados.</strong><br>${esc(e.message)} — verifique se o servidor (python app.py) está em execução.</div></div>`;
  }
  window.scrollTo(0, 0);
}
const refresh = () => route();

document.addEventListener('DOMContentLoaded', () => {
  shell();
  window.addEventListener('hashchange', route);
  route();
});
</script>
<script>if (document.readyState !== 'loading') document.dispatchEvent(new Event('DOMContentLoaded'));</script>
